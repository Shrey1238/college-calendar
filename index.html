<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Calendar</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b23; --panel2: #1f2330; --line: #2a2f3e;
    --text: #e7e9ee; --dim: #9aa0ae; --accent: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 18px 24px 10px; display: flex; flex-wrap: wrap; gap: 12px;
           align-items: baseline; justify-content: space-between; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  .meta { color: var(--dim); font-size: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 12px; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 999px;
          background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
  .chip.active { border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; padding: 0 24px 24px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between;
              padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .cal-head h2 { font-size: 16px; margin: 0; font-weight: 600; }
  .nav button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
                border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 14px; }
  .nav button:hover { background: var(--line); }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 8px 0;
         color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .dow div { text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 8px; }
  .day { min-height: 86px; background: var(--panel2); border: 1px solid transparent;
         border-radius: 8px; padding: 5px; font-size: 12px; overflow: hidden; }
  .day.other { opacity: .35; }
  .day.today { border-color: var(--accent); }
  .day .num { font-weight: 600; color: var(--dim); margin-bottom: 3px; }
  .ev { display: block; margin: 2px 0; padding: 2px 6px; border-radius: 5px; font-size: 11px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
        border-left: 3px solid var(--accent); background: rgba(255,255,255,.05); }
  .ev.exam { border-left-color: #ef4444; }
  .ev.final { border-left-color: #dc2626; font-weight: 600; }
  .agenda { padding: 12px 16px; }
  .agenda h2 { font-size: 16px; margin: 0 0 10px; font-weight: 600; }
  .daygroup { margin-bottom: 14px; }
  .daygroup h3 { font-size: 12px; color: var(--dim); margin: 0 0 6px;
                 text-transform: uppercase; letter-spacing: .05em; }
  .item { display: flex; gap: 10px; padding: 8px 10px; border-radius: 8px;
          background: var(--panel2); margin-bottom: 6px; align-items: flex-start; }
  .item .bar { width: 4px; border-radius: 2px; align-self: stretch; }
  .item .t { font-size: 12px; color: var(--dim); width: 62px; flex-shrink: 0; padding-top: 1px; }
  .item .b { flex: 1; }
  .item .title { font-size: 13px; }
  .item .sub { font-size: 11px; color: var(--dim); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.07); font-size: 10px; }
  .empty { color: var(--dim); font-size: 13px; padding: 20px; text-align: center; }
  .due-soon { color: #f87171; font-weight: 600; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 12px; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }

  /* productivity additions */
  .controls { display: flex; gap: 8px; align-items: center; }
  .searchbox { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
               border-radius: 8px; padding: 5px 10px; font-size: 13px; width: 170px; }
  .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
         border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .btn:hover { background: var(--line); }
  .nextup { margin: 0 24px 12px; padding: 12px 16px; border-radius: 10px; font-size: 14px;
            background: linear-gradient(90deg, rgba(245,158,11,.15), rgba(245,158,11,.03));
            border: 1px solid rgba(245,158,11,.35); display: flex; gap: 8px; flex-wrap: wrap;
            align-items: baseline; }
  .nextup .lbl { color: var(--accent); font-weight: 700; font-size: 12px;
                 text-transform: uppercase; letter-spacing: .05em; }
  .exams { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 12px; }
  .exams .chip { border-color: rgba(239,68,68,.4); }
  .exams .chip b { color: #f87171; }
  .item.done .title { text-decoration: line-through; color: var(--dim); }
  .item.done { opacity: .45; }
  .item .check { accent-color: var(--accent); margin-top: 3px; cursor: pointer; }
  .ev.done { text-decoration: line-through; opacity: .4; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 44px; padding: 4px 2px 0; }
  .bars .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .bars .bar { width: 100%; border-radius: 3px 3px 0 0; background: var(--accent);
               min-height: 2px; opacity: .8; }
  .bars .lab { font-size: 9px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>College Calendar</h1>
  <div class="controls">
    <input class="searchbox" id="search" placeholder="Filter events..." oninput="query=this.value; render(); renderAgenda();">
    <button class="btn" onclick="exportICS()">Export .ics</button>
    <div class="meta" id="meta"></div>
  </div>
</header>
<div class="nextup" id="nextup"></div>
<div class="legend" id="legend"></div>
<div class="exams" id="exams"></div>
<div class="layout">
  <div class="card">
    <div class="cal-head">
      <h2 id="monthLabel"></h2>
      <div class="nav">
        <button onclick="shiftMonth(-1)">&#8249;</button>
        <button onclick="goToday()">Today</button>
        <button onclick="shiftMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="card agenda">
    <h2>Next 14 days</h2>
    <div class="bars" id="bars"></div>
    <div id="agenda"></div>
  </div>
</div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
let DATA = { events: [], courses: {} };
let view = new Date(); view.setDate(1);
let hidden = new Set();
let showClasses = false;
let query = '';
let doneSet = new Set(JSON.parse(localStorage.getItem('cc_done') || '[]'));
const doneKey = e => e.title + '|' + e.start;
function toggleDone(e){
  const k = doneKey(e);
  doneSet.has(k) ? doneSet.delete(k) : doneSet.add(k);
  localStorage.setItem('cc_done', JSON.stringify([...doneSet]));
  render(); renderAgenda(); renderNextUp(); renderBars();
}

const fmtTime = d => d ? d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
const fmtDate = d => d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'});
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

function evStart(e){
  if (!e.start) return null;
  // Date-only values ("2026-10-08") parse as UTC midnight — anchor to local
  // noon so they land on the right day in every timezone.
  if (/^\d{4}-\d{2}-\d{2}$/.test(e.start)) return new Date(e.start + 'T12:00:00');
  return new Date(e.start);
}
function visible(e){
  return (!e.course || !hidden.has(e.course))
    && (showClasses || e.type !== 'class')
    && (!query || e.title.toLowerCase().includes(query.toLowerCase()));
}
function color(e){
  const c = e.course && DATA.courses[e.course];
  return c ? c.color : '#8b93a5';
}
function daysUntil(d){
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now)/86400000);
}

async function load(){
  const r = await fetch('events.json', {cache:'no-store'});
  DATA = await r.json();
  document.getElementById('meta').textContent =
    'Updated ' + new Date(DATA.generated_at).toLocaleString();
  renderLegend(); render(); renderAgenda(); renderNextUp(); renderExams(); renderBars();
}

function renderNextUp(){
  const el = document.getElementById('nextup');
  const now = new Date();
  const next = DATA.events
    .filter(e => visible(e) && e.type !== 'class' && !doneSet.has(doneKey(e)) && evStart(e) && evStart(e) >= now)
    .sort((a, b) => evStart(a) - evStart(b))[0];
  if (!next){ el.style.display = 'none'; return; }
  el.style.display = '';
  const d = evStart(next);
  const hrs = Math.max(0, Math.round((d - now) / 3600000));
  const when = hrs < 48 ? `${hrs}h` : `${Math.round(hrs / 24)}d`;
  el.innerHTML = `<span class="lbl">Next up</span> <b>${next.title}</b>
    <span style="color:${color(next)}">&#9679;</span> ${fmtDate(d)} ${fmtTime(d)} &middot; <b>in ${when}</b>
    <button class="btn" style="margin-left:auto;padding:2px 10px" onclick='toggleDone(${JSON.stringify(doneKey(next)).replace(/'/g, "&#39;")})'>Mark done</button>`;
}

function renderExams(){
  const el = document.getElementById('exams'); el.innerHTML = '';
  const now = new Date();
  const exams = DATA.events
    .filter(e => ['exam', 'final'].includes(e.type) && evStart(e) && evStart(e) >= now)
    .sort((a, b) => evStart(a) - evStart(b));
  for (const e of exams){
    const d = evStart(e);
    const n = Math.ceil((d - now) / 86400000);
    const s = document.createElement('span'); s.className = 'chip';
    s.innerHTML = `${e.title} &middot; <b>${n}d</b>`;
    s.onclick = () => showEvent(e);
    el.appendChild(s);
  }
}

function renderBars(){
  const el = document.getElementById('bars'); el.innerHTML = '';
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const counts = Array(14).fill(0);
  for (const e of DATA.events){
    if (!visible(e) || e.type === 'class' || doneSet.has(doneKey(e))) continue;
    const d = evStart(e); if (!d) continue;
    const i = Math.floor((d - now) / 86400000);
    if (i >= 0 && i < 14) counts[i]++;
  }
  const max = Math.max(...counts, 1);
  counts.forEach((c, i) => {
    const d = new Date(now); d.setDate(now.getDate() + i);
    const col = document.createElement('div'); col.className = 'col';
    col.title = `${fmtDate(d)}: ${c} item${c === 1 ? '' : 's'}`;
    col.innerHTML = `<div class="bar" style="height:${Math.round(c / max * 30) + 2}px"></div>
      <div class="lab">${d.toLocaleDateString([], {weekday: 'narrow'})}</div>`;
    el.appendChild(col);
  });
}

function renderLegend(){
  const el = document.getElementById('legend'); el.innerHTML = '';
  for (const [key, c] of Object.entries(DATA.courses || {})){
    const s = document.createElement('span');
    s.className = 'chip' + (hidden.has(key) ? '' : ' active');
    s.innerHTML = `<span style="color:${c.color}">&#9679;</span> ${c.name}`;
    s.onclick = () => { hidden.has(key) ? hidden.delete(key) : hidden.add(key); renderLegend(); render(); renderAgenda(); };
    el.appendChild(s);
  }
  const t = document.createElement('span');
  t.className = 'chip' + (showClasses ? ' active' : '');
  t.textContent = 'Class sessions';
  t.onclick = () => { showClasses = !showClasses; renderLegend(); render(); renderAgenda(); };
  el.appendChild(t);
}

function render(){
  const g = document.getElementById('grid'); g.innerHTML = '';
  const y = view.getFullYear(), m = view.getMonth();
  document.getElementById('monthLabel').textContent =
    view.toLocaleDateString([], {month:'long', year:'numeric'});
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const todayKey = dayKey(new Date());
  const byDay = {};
  for (const e of DATA.events){
    if (!visible(e)) continue;
    const d = evStart(e); if (!d) continue;
    (byDay[dayKey(d)] ||= []).push(e);
  }
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i);
    const cell = document.createElement('div');
    cell.className = 'day' + (d.getMonth() !== m ? ' other' : '') + (dayKey(d) === todayKey ? ' today' : '');
    cell.innerHTML = `<div class="num">${d.getDate()}</div>`;
    for (const e of (byDay[dayKey(d)] || [])){
      const s = document.createElement('span');
      s.className = 'ev ' + e.type + (doneSet.has(doneKey(e)) ? ' done' : '');
      s.style.borderLeftColor = color(e);
      s.textContent = e.title;
      s.onclick = () => showEvent(e);
      cell.appendChild(s);
    }
    g.appendChild(cell);
  }
}

function renderAgenda(){
  const el = document.getElementById('agenda'); el.innerHTML = '';
  const now = new Date(); now.setHours(0,0,0,0);
  const horizon = new Date(now); horizon.setDate(now.getDate() + 14);
  const groups = {};
  for (const e of DATA.events){
    if (!visible(e)) continue;
    const d = evStart(e); if (!d || d < now || d >= horizon) continue;
    (groups[dayKey(d)] ||= []).push(e);
  }
  const keys = Object.keys(groups).sort();
  if (!keys.length){ el.innerHTML = '<div class="empty">Nothing due in the next two weeks. Nice.</div>'; return; }
  for (const k of keys){
    const d = new Date(k + 'T12:00:00');
    const grp = document.createElement('div'); grp.className = 'daygroup';
    const n = daysUntil(d);
    const label = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : fmtDate(d);
    grp.innerHTML = `<h3>${label}${n >= 0 && n <= 2 ? ' <span class="due-soon">(' + n + 'd)</span>' : ''}</h3>`;
    for (const e of groups[k]){
      const sd = evStart(e);
      const item = document.createElement('div');
      item.className = 'item' + (doneSet.has(doneKey(e)) ? ' done' : '');
      item.innerHTML = `<input type="checkbox" class="check" ${doneSet.has(doneKey(e)) ? 'checked' : ''}>
        <div class="bar" style="background:${color(e)}"></div>
        <div class="t">${fmtTime(sd) || 'All day'}</div>
        <div class="b"><div class="title">${e.title}</div>
        <div class="sub"><span class="badge">${e.type}</span>
        <span class="badge">${e.source}</span>
        ${e.course && DATA.courses[e.course] ? `<span class="badge">${DATA.courses[e.course].name}</span>` : ''}
        </div></div>`;
      item.querySelector('.check').onclick = ev => { ev.stopPropagation(); toggleDone(e); };
      item.onclick = () => showEvent(e);
      item.style.cursor = 'pointer';
      grp.appendChild(item);
    }
    el.appendChild(grp);
  }
}

function showEvent(e){
  const b = document.getElementById('dlgBody');
  const d = evStart(e);
  b.innerHTML = `<h3 style="margin-top:0">${e.title}</h3>
    <p>${d ? fmtDate(d) + ' ' + fmtTime(d) : ''}</p>
    ${e.location ? `<p>&#128205; ${e.location}</p>` : ''}
    ${e.notes ? `<p>${e.notes}</p>` : ''}
    ${e.url ? `<p><a href="${e.url}" target="_blank" style="color:#7dd3fc">Open in Canvas</a></p>` : ''}
    <p style="color:var(--dim);font-size:12px">${e.type} &middot; ${e.source}</p>
    <button onclick="document.getElementById('dlg').close()"
      style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer">Close</button>`;
  document.getElementById('dlg').showModal();
}

function shiftMonth(n){ view.setMonth(view.getMonth() + n); render(); }
function goToday(){ view = new Date(); view.setDate(1); render(); }

function exportICS(){
  const esc = s => (s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  const dt = d => {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
  };
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//college-calendar//EN'];
  for (const e of DATA.events){
    const d = evStart(e); if (!d) continue;
    const ed = e.end ? new Date(e.end) : d;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + encodeURIComponent(e.title + e.start));
    lines.push('DTSTART:' + dt(d));
    lines.push('DTEND:' + dt(ed));
    lines.push('SUMMARY:' + esc(e.title));
    if (e.location) lines.push('LOCATION:' + esc(e.location));
    if (e.url) lines.push('URL:' + e.url);
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type: 'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'college-calendar.ics';
  a.click();
}

load();
</script>
</body>
</html>
