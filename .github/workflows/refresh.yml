name: Refresh calendar data

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install icalendar pyyaml

      - name: Build events.json
        env:
          CANVAS_ICS_URL: ${{ secrets.CANVAS_ICS_URL }}
        run: python ingest.py

      - name: Commit refreshed data
        run: |
          git config user.name "calendar-bot"
          git config user.email "calendar-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Refresh events $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
